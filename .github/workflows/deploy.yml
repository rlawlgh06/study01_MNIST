# web_version/ 폴더를 GitHub Pages 로 발행합니다.
# Pages 는 저장소 루트나 /docs 만 직접 서빙하므로, 하위 폴더를 올리려면 이 워크플로가 필요합니다.
#
# 처음 한 번은 GitHub 저장소 설정에서 Settings → Pages → Source 를
# "GitHub Actions" 로 바꿔 주어야 합니다.
name: web_version 을 GitHub Pages 로 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 뒤엣것만 남깁니다. 진행 중인 배포는 취소하지 않습니다.
concurrency:
  group: pages
  cancel-in-progress: false

# job id 와 step id 는 GitHub Actions 스키마상 ASCII (영문자/숫자/-/_)만 허용됩니다.
# 한글 id 를 쓰면 워크플로 전체가 "Invalid workflow file" 로 거부됩니다.
# 사람이 보는 이름은 name: 에 한글로 쓰고, id: 는 반드시 ASCII 로 남기세요.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: web_version 폴더를 아티팩트로 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_version

      - name: Pages 에 배포
        id: deployment
        uses: actions/deploy-pages@v4
