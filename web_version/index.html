<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손글씨 숫자 인식기</title>
<link rel="stylesheet" href="css/스타일.css">
</head>
<body>

<header class="머리">
  <h1>손글씨 숫자 인식기</h1>
  <p>
    마우스나 손가락으로 숫자를 쓰면 CNN 모델이 0~9 중 무엇인지 알아맞힙니다.
    추론은 이 브라우저 안에서 외부 라이브러리 없이 순수 자바스크립트로 이루어집니다.
    · <a href="자가진단.html">자가진단</a>
  </p>
</header>

<main class="판">
  <section class="그림판칸">
    <h2>여기에 숫자를 크게 쓰세요</h2>
    <canvas id="화면캔버스"></canvas>
    <canvas id="모델캔버스"></canvas>
    <div class="단추줄">
      <button id="인식단추" type="button">인식하기 (Enter)</button>
      <button id="지우기단추" type="button">지우기 (C)</button>
    </div>
  </section>

  <section id="결과"></section>
</main>

<script>
// 클래식 스크립트입니다 (type="module" 아님). 아래 모듈 스크립트는 file:// 에서
// CORS 로 막혀 아예 실행되지 않으므로, 그 안의 file:// 안내도 함께 죽어버립니다.
// 그래서 이 클래식 스크립트가 먼저 실행 여부를 확인해 안내를 띄웁니다.
if (location.protocol === 'file:') {
  var 안내상자 = document.createElement('div');
  안내상자.style.cssText =
    'background:#b71c1c;color:#fff;padding:16px 20px;margin:0 0 16px;' +
    'font-family:"Malgun Gothic",system-ui,sans-serif;font-size:1.05rem;line-height:1.6;';
  안내상자.innerHTML =
    '이 페이지를 <b>file://</b> 로 열어서 스크립트가 실행되지 않습니다.<br>' +
    'web_version 폴더에서 아래 명령으로 로컬 서버를 띄운 뒤, ' +
    '<b>http://localhost:8000/</b> 주소로 다시 열어 주세요.<br>' +
    '<code style="background:#7f0000;padding:2px 6px;border-radius:4px;">py -m http.server 8000</code>';
  document.body.insertBefore(안내상자, document.body.firstChild);
}
</script>
<script type="module" src="js/앱.js"></script>
</body>
</html>
